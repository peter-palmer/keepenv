name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, Clippy
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, lint
        run: npm run check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Build frontend bundle
        run: npx vite build

      - name: Assert the bundle makes no network calls
        run: |
          if grep -rqE 'fetch\(|XMLHttpRequest|new WebSocket|sendBeacon' dist/assets/*.js; then
            echo "::error::A network API reached the production bundle. Keepenv must never make network requests."
            exit 1
          fi
          echo "No network APIs in the bundle."
